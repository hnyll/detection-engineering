[project]
name = "detection-engineering"
version = "0.1.0"
description = "Competency-based object detection engineering harness: YOLO11 on VisDrone with W&B, FiftyOne, TIDE, and deployment benchmarks"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "ultralytics==8.4.65",
    "numpy==1.26.4",          # deliberate: tidecv / onnxruntime / fiftyone / torch all compatible
    "pycocotools==2.0.8",
    "wandb==0.19.11",
    "fiftyone==1.5.2",
    "strawberry-graphql==0.290.0",  # fiftyone 1.5.2's server still uses the 'graphiql' kwarg,
                                     # removed in strawberry-graphql 0.295.0; unpinned, uv
                                     # resolves latest and the FiftyOne app fails to launch
                                     # (TypeError: GraphQL.__init__() got an unexpected keyword
                                     # argument 'graphiql'). Bisected known-good: 0.290.0 works,
                                     # 0.295.0 breaks.
    "starlette==0.52.1",  # fiftyone 1.5.2's static-file serving still passes a 'method' kwarg
                           # to starlette.responses.FileResponse.__init__(), removed in
                           # starlette 1.0.0; unpinned, uv resolves latest (1.x) and the app
                           # 500s on every static asset request. Bisected known-good: 0.52.1
                           # (last pre-1.0 release) works, 1.0.0 breaks.
    "sahi==0.11.20",
    "tidecv==1.0.1",
    "onnx==1.17.0",
    "onnxruntime-gpu==1.20.1",
    "onnxslim==0.1.48",
    "coremltools==8.2",
    "matplotlib==3.9.2",
    "pandas==2.2.3",
    "tqdm==4.68.4",
    "PyYAML==6.0.2",
]

[dependency-groups]
# TensorRT is heavy (~2GB) and only needed for the Deploy competency's engine
# benchmarks; kept in its own group so a resolution failure never blocks the core env.
trt = ["tensorrt-cu12==10.9.0.34"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
