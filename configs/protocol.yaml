# THE fixed evaluation protocol. Single source of truth for every eval.
# Every metrics.json records the SHA-256 of this file as protocol.hash;
# `compare` refuses to compare runs whose hashes differ. Changing anything
# here invalidates comparability with all previous results — do it knowingly.
split: val
imgsz: 640
conf: 0.001        # low confidence floor so PR curves / COCOeval see the full range
iou: 0.7           # NMS IoU threshold
max_det: 300
device: 0

latency:           # separate timed pass; never measured during the accuracy pass
  batch: 1
  warmup: 20
  timed: 100
